<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Opowiadań</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📖 Generator Opowiadań</h1>
        <p class="subtitle">Stwórz unikalne 5-rozdziałowe opowiadanie</p>
        
        <form id="story-form">
            <div class="form-group">
                <label for="genre">Gatunek</label>
                <select id="genre" name="genre">
                    <option value="fantasy">Fantasy</option>
                    <option value="science fiction">Science Fiction</option>
                    <option value="horror">Horror</option>
                    <option value="romans">Romans</option>
                    <option value="kryminał">Kryminał</option>
                    <option value="baśń">Baśń</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="protagonist">Główny bohater</label>
                <input type="text" id="protagonist" name="protagonist" 
                       placeholder="np. odważna czarodziejka, cyniczny detektyw">
            </div>
            
            <div class="form-group">
                <label for="setting">Miejsce akcji</label>
                <input type="text" id="setting" name="setting" 
                       placeholder="np. futurystyczne miasto, zaczarowany las">
            </div>
            
            <div class="form-group">
                <label for="mood">Nastrój</label>
                <select id="mood" name="mood">
                    <option value="przygodowy">Przygodowy</option>
                    <option value="mroczny">Mroczny</option>
                    <option value="humorystyczny">Humorystyczny</option>
                    <option value="nostalgiczny">Nostalgiczny</option>
                    <option value="napięty">Napięty</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="theme">Motyw przewodni</label>
                <input type="text" id="theme" name="theme" 
                       placeholder="np. zdrada, odkupienie, miłość">
            </div>
            
            <button type="submit" id="generate-btn">
                <span class="btn-text">Generuj opowiadanie</span>
                <span class="spinner hidden"></span>
            </button>
        </form>
        
        <div id="story-output" class="hidden">
            <h2>Twoje opowiadanie</h2>
            <div id="story-content"></div>
        </div>
    </div>

    <script>
        document.getElementById('story-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('generate-btn');
            const btnText = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');
            const output = document.getElementById('story-output');
            const content = document.getElementById('story-content');
            
            // Stan ładowania
            btn.disabled = true;
            btnText.textContent = 'Generowanie...';
            spinner.classList.remove('hidden');
            output.classList.add('hidden');
            
            const formData = {
                genre: document.getElementById('genre').value,
                protagonist: document.getElementById('protagonist').value || undefined,
                setting: document.getElementById('setting').value || undefined,
                mood: document.getElementById('mood').value,
                theme: document.getElementById('theme').value || undefined
            };
            
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    content.innerHTML = marked.parse(data.story);
                    output.classList.remove('hidden');
                    output.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert('Błąd: ' + data.error);
                }
            } catch (error) {
                alert('Wystąpił błąd połączenia');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Generuj opowiadanie';
                spinner.classList.add('hidden');
            }
        });
    </script>
    <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/marked/marked.min.js)"></script>
</body>
</html>
